name: build-worker

# Builds the reconnaissance worker image and pushes it to GHCR.
#
# This runs in CI rather than on a laptop for two reasons: the base image is
# linux/amd64 only, so an arm64 Mac would cross-build under emulation, and the
# runner's GITHUB_TOKEN already has write access to this repository's GHCR
# namespace, so no personal access token has to be minted or stored.

on:
  push:
    branches: ["**"]
    paths:
      - "worker/**"
      # The image vendors this package (see the Dockerfile's COPY), so a change
      # here changes the image. Omitting it meant every coldstart/ fix shipped a
      # stale image while the digest looked current -- including, once, the
      # pre-probe cache-observation fix the arm-state gate depends on.
      - "coldstart/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The endpoint must be pinned to the digest, not to a tag. Tags move;
      # a reader rebuilding this experiment has to get the same engine, and
      # the same reasoning already pins the vLLM base image in the Dockerfile.
      - name: Report the immutable reference
        run: |
          {
            echo "## Worker image"
            echo
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin the RunPod endpoint to the digest above, not to \`:latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
