<svg id="spine" viewBox="0 0 800 1010" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="The apparatus: seven zones, three clocks, and what travels between them"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    /* Sizes are user units, so they scale with the viewBox. The floor is 26:
       at the narrowest supported rendering (343 CSS px on a 375px phone) that
       lands at 11.2 CSS px, which is the legibility floor this repo has twice
       shipped a regression under. Nothing here may go below 26. */
    #spine text { fill: currentColor; }
    #spine .zt { font-size: 28px; font-weight: 600; }
    #spine .zt-s { font-size: 26px; font-weight: 600; }
    #spine .c { font-size: 26px; }
    #spine .e { font-size: 26px; }
    #spine .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 25px; }
    #spine .box { fill: currentColor; fill-opacity: .045; stroke: currentColor; stroke-width: 2.5; }
    #spine .box-dash { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-dasharray: 10 8; }
    #spine .lead { fill: none; stroke: currentColor; stroke-width: 3; }
    #spine .lead-dash { fill: none; stroke: currentColor; stroke-width: 3; stroke-dasharray: 9 7; }
    #spine .bar { fill: currentColor; fill-opacity: .55; }
    /* Accents carry meaning (which clock stamped a number), so they are the one
       thing not drawn in currentColor. Driven by page variables so the theme
       still owns them; the literal is only a fallback. */
    #spine text.ca { fill: var(--clk-a, #1f5fc4); }
    #spine text.cb { fill: var(--clk-b, #a8460b); }
    #spine text.cc { fill: var(--clk-c, #6d28a8); }
    #spine rect.ba { fill: var(--clk-a, #1f5fc4); fill-opacity: .14; stroke: var(--clk-a, #1f5fc4); stroke-width: 2.5; }
    #spine rect.bb { fill: var(--clk-b, #a8460b); fill-opacity: .14; stroke: var(--clk-b, #a8460b); stroke-width: 2.5; }
    #spine rect.bc { fill: var(--clk-c, #6d28a8); fill-opacity: .14; stroke: var(--clk-c, #6d28a8); stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="spine-arrow" viewBox="0 0 20 16" markerUnits="userSpaceOnUse"
            markerWidth="20" markerHeight="16" refX="19" refY="8" orient="auto">
      <path d="M0,0 L20,8 L0,16 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ===== zone 1 &#183; your laptop ===================================== -->
  <g id="zone-1" class="dim lit">
    <rect class="box" x="76" y="8" width="680" height="144" rx="10"/>
    <text class="zt" x="94" y="48">1 &#183; your laptop</text>
    <text class="c" x="94" y="96">scheduler</text>
    <text class="c" x="212" y="96">cache_config</text>
    <text class="c" x="402" y="96">preflight</text>
    <text class="c" x="94" y="130">driver</text>
    <text class="c" x="212" y="130">submitter</text>
  </g>

  <!-- ===== zone 2 &#183; RunPod ========================================== -->
  <g id="zone-2" class="dim">
    <rect class="box" x="76" y="204" width="428" height="146" rx="10"/>
    <text class="zt" x="94" y="244">2 &#183; RunPod</text>
    <text class="c" x="94" y="290">queue</text>
    <text class="c" x="208" y="290">GPU allocation</text>
    <text class="c" x="94" y="322">network volume</text>
  </g>

  <!-- ===== zone 7 &#183; the test rig (apart: it replaces zone 2) ======== -->
  <g id="zone-7" class="dim">
    <rect class="box-dash" x="528" y="204" width="228" height="192" rx="10"/>
    <text class="zt-s" x="546" y="244">7 &#183; the test rig</text>
    <text class="c" x="546" y="288">stubs</text>
    <text class="c" x="546" y="320">fixtures</text>
  </g>

  <!-- ===== zone 3 &#183; the container =================================== -->
  <g id="zone-3" class="dim">
    <rect class="box" x="76" y="404" width="680" height="296" rx="10"/>
    <text class="zt" x="94" y="444">3 &#183; the container</text>
    <text class="c" x="94" y="488">handler</text>
    <text class="c" x="240" y="488">probe</text>
    <text class="c" x="376" y="488">recorder</text>
  </g>

  <!-- ===== zone 4 &#183; vLLM (runs inside the container) ================ -->
  <g id="zone-4" class="dim">
    <rect class="box" x="94" y="510" width="330" height="184" rx="8"/>
    <text class="zt" x="112" y="548">4 &#183; vLLM</text>
    <text class="c" x="112" y="584">load weights</text>
    <text class="c" x="112" y="616">compile</text>
    <text class="c" x="112" y="648">size KV cache</text>
    <text class="c" x="112" y="680">capture CUDA graphs</text>
  </g>

  <!-- ===== zone 5 &#183; the record ====================================== -->
  <g id="zone-5" class="dim">
    <rect class="box" x="76" y="752" width="300" height="150" rx="10"/>
    <text class="zt" x="94" y="792">5 &#183; the record</text>
    <text class="c" x="94" y="836">schema</text>
    <text class="c" x="210" y="836">store</text>
    <text class="c" x="94" y="868">campaign.jsonl</text>
  </g>

  <!-- ===== zone 6 &#183; offline, no GPU (apart: nothing here is rented) = -->
  <g id="zone-6" class="dim">
    <rect class="box-dash" x="404" y="752" width="352" height="250" rx="10"/>
    <text class="zt-s" x="422" y="792">6 &#183; offline, no GPU</text>
    <text class="c" x="422" y="836">pipeline</text>
    <text class="c" x="596" y="836">metrics</text>
    <text class="c" x="422" y="868">checks</text>
    <text class="c" x="596" y="868">figures</text>
    <text class="c" x="422" y="900">stats</text>
    <text class="c" x="422" y="942">clocks reconciled</text>
  </g>

  <!-- ===== the three clocks ========================================
       Each clock appears twice: once on the machine that stamps it, and
       once in zone 6, where the three are put on one axis. -->
  <g id="clock-A" class="dim">
    <rect class="ba" x="640" y="22" width="108" height="36" rx="18"/>
    <text class="c ca" x="694" y="47" text-anchor="middle">clock A</text>
    <rect class="ba" x="422" y="958" width="108" height="36" rx="18"/>
    <text class="c ca" x="476" y="983" text-anchor="middle">clock A</text>
  </g>
  <g id="clock-B" class="dim">
    <rect class="bb" x="640" y="418" width="108" height="36" rx="18"/>
    <text class="c cb" x="694" y="443" text-anchor="middle">clock B</text>
    <rect class="bb" x="534" y="958" width="108" height="36" rx="18"/>
    <text class="c cb" x="588" y="983" text-anchor="middle">clock B</text>
  </g>
  <g id="clock-C" class="dim">
    <rect class="bc" x="384" y="218" width="108" height="36" rx="18"/>
    <text class="c cc" x="438" y="243" text-anchor="middle">clock C</text>
    <rect class="bc" x="646" y="958" width="108" height="36" rx="18"/>
    <text class="c cc" x="700" y="983" text-anchor="middle">clock C</text>
  </g>

  <!-- ===== edges. Every one says what travels it. =================== -->
  <g id="edge-1" class="dim">
    <path class="lead" d="M182,158 V198" marker-end="url(#spine-arrow)"/>
    <text class="e" x="202" y="192">{arm, run_id} job input</text>
  </g>

  <g id="edge-2" class="dim">
    <path class="lead" d="M182,356 V398" marker-end="url(#spine-arrow)"/>
    <text class="e" x="202" y="384">the job reaches handler</text>
  </g>

  <g id="edge-3" class="dim">
    <path class="lead" d="M458,572 H432" marker-end="url(#spine-arrow)"/>
    <text class="mono" x="468" y="564">vllm serve</text>
    <text class="e" x="468" y="596">as a subprocess</text>
  </g>

  <g id="edge-4" class="dim">
    <path class="lead" d="M428,652 H454" marker-end="url(#spine-arrow)"/>
    <text class="e" x="468" y="644">stdout lines become</text>
    <text class="e" x="468" y="676">S* marks</text>
  </g>

  <g id="edge-5" class="dim">
    <path class="lead" d="M756,432 H776 V90 H762" marker-end="url(#spine-arrow)"/>
    <text class="e" x="752" y="500" text-anchor="end">result JSON</text>
    <text class="e" x="752" y="532" text-anchor="end">on the result channel</text>
  </g>

  <g id="edge-6" class="dim">
    <path class="lead" d="M76,140 H20 V820 H72" marker-end="url(#spine-arrow)"/>
    <text class="e" transform="rotate(-90 38 480)" x="38" y="480" text-anchor="middle">a campaign.jsonl row</text>
  </g>

  <g id="edge-7" class="dim">
    <path class="lead" d="M250,752 V726 H560 V746" marker-end="url(#spine-arrow)"/>
    <text class="e" x="405" y="718" text-anchor="middle">a derived row</text>
  </g>

  <g id="edge-8" class="dim">
    <path class="lead" d="M402,970 H352" marker-end="url(#spine-arrow)"/>
    <path class="lead" d="M196,1000 H340"/>
    <rect class="bar" x="200" y="970" width="26" height="30"/>
    <rect class="bar" x="236" y="954" width="26" height="46"/>
    <rect class="bar" x="272" y="978" width="26" height="22"/>
    <rect class="bar" x="308" y="948" width="26" height="52"/>
    <text class="e" x="100" y="992">a chart</text>
  </g>

  <g id="edge-9" class="dim">
    <path class="lead-dash" d="M528,300 H508" marker-end="url(#spine-arrow)"/>
    <text class="e" x="546" y="356">in tests, this</text>
    <text class="e" x="546" y="384">replaces RunPod</text>
  </g>
</svg>
