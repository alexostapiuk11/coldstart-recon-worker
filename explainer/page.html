<title>Where a Cold Start Goes</title>
<h1>Where a cold start goes</h1>
<p>A cold start is the wait while a machine boots and loads a model, before
anyone gets an answer. Arm C's median cold start is {{median_t_total_C}}
seconds, against {{median_t_total_A}} with nothing cached.</p>

  <figcaption>What the saved time buys: a KV cache is per-conversation scratch
